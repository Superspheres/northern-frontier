- type: entity
  id: 40mmGrenadeFrag
  name: 40mm HE grenade
  description: A high-explosive 40mm round with a broad concussive blast and no fragmentation.
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - N14Grenade
  - type: CartridgeAmmo
    proto: GrenadeProjectile
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: frag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

# Misfits Add - All variants inherit the launcher's N14Grenade tag and casing
# behavior. Only the impact payload and ammunition appearance change.
- type: entity
  id: 40mmGrenadeHEDP
  parent: 40mmGrenadeFrag
  name: 40mm HEDP grenade
  description: A 40mm round combining a compact explosive blast with lethal fragmentation. Use from cover.
  components:
  - type: CartridgeAmmo
    proto: N1440mmHEDPProjectile
  - type: Sprite
    layers:
    - state: he
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
